# Render Blueprint — single Docker service serving both the SPA and the API.
# In Render: New + -> Blueprint -> pick this repo. After the first deploy,
# set ANTHROPIC_API_KEY (your Gemini key) in the service's Environment tab.
services:
  - type: web
    name: ai-portfolio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Spring Boot relaxed binding maps this env var to `anthropic.api.key`.
      # sync:false marks it a secret — paste the value in the Render dashboard.
      - key: ANTHROPIC_API_KEY
        sync: false
