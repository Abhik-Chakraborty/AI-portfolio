# Load optional secrets (gitignored; run app with cwd = backend/)
spring.config.import=optional:file:./config/local.properties

# Server — Render (and most PaaS hosts) inject PORT; falls back to 8081 for local dev
server.port=${PORT:8081}

# Gemini (free tier) via its OpenAI-compatible endpoint — put anthropic.api.key in config/local.properties only.
# Get a free key (no credit card) from https://aistudio.google.com/apikey
anthropic.api.url=https://generativelanguage.googleapis.com/v1beta/openai/chat/completions
# Current generally-available flash model. Older aliases (gemini-flash-lite-latest,
# gemini-2.0-flash) were retired by Google; update this if the API reports it's gone.
anthropic.model=gemini-3.6-flash
openrouter.http.referer=http://localhost:5173

# Web search — DuckDuckGo Instant Answer API (free, no key required)
duckduckgo.search.url=https://api.duckduckgo.com/

# CORS (comma-separate for multiple origins)
cors.allowed.origins=http://localhost:5173

# Logging ? Spring Boot 3.x property names
logging.level.root=WARN
logging.level.com.portfolio=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=10
logging.logback.rollingpolicy.total-size-cap=100MB